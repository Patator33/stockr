name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'stockr-backend/**'
      - '.github/workflows/docker-publish.yml'

concurrency:
  group: docker-build
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stockr-backend/package-lock.json

      - name: Install dependencies
        working-directory: stockr-backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: stockr-backend
        run: npx prisma generate
        env:
          DATABASE_URL: 'file:./dev.db'

      - name: TypeScript check
        working-directory: stockr-backend
        run: npx tsc --noEmit

      - name: Set lowercase image name
        run: echo "IMAGE_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: stockr-backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_LOWER }}:${{ github.sha }}

      - name: Trigger Portainer redeploy
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL"
          fi
